<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Demfilz SMTP Mailer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5efc"/>
      <stop offset="1" stop-color="#4f7bff"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0f8"/>
    </linearGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ce6bb"/>
      <stop offset="1" stop-color="#12b78d"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="0" y="0" width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect x="0" y="0" width="256" height="256" rx="58" fill="#ffffff" opacity="0.06"/>

  <!-- speed trail, the message on its way out -->
  <g stroke="#ffffff" stroke-opacity="0.34" stroke-width="9" stroke-linecap="round">
    <line x1="30" y1="82" x2="74" y2="82"/>
    <line x1="18" y1="114" x2="58" y2="114"/>
    <line x1="30" y1="146" x2="66" y2="146"/>
  </g>

  <!-- envelope body -->
  <rect x="70" y="76" width="152" height="112" rx="18" fill="#0a0d16" opacity="0.18"/>
  <rect x="70" y="70" width="152" height="112" rx="18" fill="url(#face)"/>

  <!-- flap, open, so the message can leave -->
  <path d="M70 88 l76 52 l76 -52" fill="none" stroke="#9aa3c4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- paper plane leaving the envelope -->
  <g transform="translate(150 116) rotate(-14)">
    <path d="M0 0 l96 -44 l-30 96 l-20 -34 z" fill="#0a0d16" opacity="0.18" transform="translate(4 8)"/>
    <path d="M0 0 l96 -44 l-30 96 l-20 -34 z" fill="url(#plane)" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
    <path d="M0 0 l46 18" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
